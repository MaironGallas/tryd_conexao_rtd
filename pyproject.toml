[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tryd-rtd"
version = "0.2.0"
description = "Cliente Python para o servidor RTD do Tryd (Times & Trades em tempo real)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Mairon Gallas" }]
dependencies = ["colorama>=0.4.6"]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tryd-rtd = "tryd_rtd.__main__:main"

[tool.setuptools]
packages = ["tryd_rtd"]
